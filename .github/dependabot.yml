version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
  # The web app's container has its own requirements file.
  - package-ecosystem: pip
    directory: /src/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # The worker image pins every package in src/worker/constraints.txt; grouped so that the pins move together.
  - package-ecosystem: pip
    directory: /src/worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      worker:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /src/web
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /src/worker
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
