name: CI

on:
  push:
  pull_request:

# Least privilege: every job reads the code, nothing else, unless it says so.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[azure,agents,web,dev]"
      # No Azure credentials here: the tests run on synthetic data and the template writer only.
      - name: Tests
        run: pytest -q

  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Builds the templates locally with the Azure CLI's Bicep; no login, nothing is deployed.
      - name: Build Bicep
        run: |
          az bicep install
          az bicep version
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/killswitch/main.bicep --stdout > /dev/null

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # gitleaks lists the commits of a pull request
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # scan the whole history, not only the last commit
          persist-credentials: false
      # Free for repositories owned by a personal account: no GITLEAKS_LICENSE needed.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
