name: CI

on:
  push:
  pull_request:

# Least privilege: every job reads the code, nothing else, unless it says so.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            src/worker/constraints.txt
      # The worker image's pins apply here too: the tests run on the versions the image installs, and a minimum raised in
      # pyproject.toml above a pin fails here rather than in the image build.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c src/worker/constraints.txt -e ".[azure,agents,agentic,web,dev]"
      # No Azure credentials here: the tests run on synthetic data and the template writer only.
      - name: Tests
        run: pytest -q

  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Builds the templates locally with the Azure CLI's Bicep; no login, nothing is deployed.
      - name: Build Bicep
        run: |
          az bicep install
          az bicep version
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/killswitch/main.bicep --stdout > /dev/null

  # Builds both images as azd would and imports what each one runs: a missing package or pin fails here, not at the first start in Azure.
  # Nothing is pushed.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the web image
        run: docker build -f src/web/Dockerfile -t watershed-web:ci .
      - name: Import the web app in it
        run: docker run --rm watershed-web:ci python -c "import web.app"
      - name: Build the worker image
        run: docker build -f src/worker/Dockerfile -t watershed-worker:ci .
      - name: Import the Writer, Agent Framework's Foundry client and Service Bus in it
        run: docker run --rm watershed-worker:ci python -c "import worker.writer, agent_framework.foundry, azure.servicebus"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # gitleaks lists the commits of a pull request
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan the whole history, not only the last commit
          persist-credentials: false
      # Free for repositories owned by a personal account: no GITLEAKS_LICENSE needed.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
