[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "watershed"
version = "0.1.0"
description = "Football's fine margins, measured live and explained to you."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=2.5.4", "scipy>=1.18.1"]

[project.optional-dependencies]
azure = ["azure-servicebus>=7.15.0", "azure-identity>=1.26.0", "azure-cosmos>=4.17.1", "python-dotenv>=1.2.4"]
agents = ["agent-framework-core>=1.23", "agent-framework-foundry>=1.15", "azure-monitor-opentelemetry>=1.8.10,<2"]
web = ["dash>=4.4.1", "plotly>=7.1.0"]
dev = ["pytest>=9.1.1", "common-data-format-validator>=0.1.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["generator*", "winprob*", "worker*", "league*", "web*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
