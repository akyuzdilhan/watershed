[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "watershed"
version = "0.1.0"
description = "Football's fine margins, measured live and explained to you."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=2.5.4", "scipy>=1.18.1"]

[project.optional-dependencies]
azure = ["azure-servicebus>=7.15.0", "azure-identity>=1.27.0", "azure-cosmos>=4.17.1", "python-dotenv>=1.2.4"]
agents = ["agent-framework-core>=1.23", "agent-framework-foundry>=1.15", "opentelemetry-sdk>=1.45.1", "azure-monitor-opentelemetry-exporter>=1.0.0b58"]
# The MCP server, the Writer's MCP transport and the duo by agents (worker.mcp_server, worker.mcp_writer, worker.duo_agents), on top of agents. Not in the worker image (src/worker/Dockerfile installs azure and agents only). Exact versions: the duo relies on Agent Framework's session and GroupChat behaviour, tested on these releases.
agentic = ["agent-framework-core==1.23.0", "agent-framework-foundry==1.15.0", "agent-framework-orchestrations==1.4.0", "mcp==2.3.0", "tenacity>=9.2.1,<9.3", "pydantic>=2.14.1,<3"]
web = ["dash>=4.4.1", "plotly>=7.1.0"]
dev = ["pytest>=9.2.0", "common-data-format-validator>=0.1.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["generator*", "winprob*", "worker*", "league*", "web*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
